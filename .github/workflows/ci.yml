name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.3"
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src/authmate tests
      - run: uv run pytest --cov=authmate --cov-branch --cov-fail-under=95
      - run: uv run python examples/background_authorization.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "uv==0.11.3"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync pytest

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==0.11.3"
      - run: uv venv
      - run: uv pip install "fastapi>=0.140,<0.141" "pydantic>=2.12,<2.13" "pytest>=9,<10" "pytest-asyncio>=1,<2" "httpx>=0.28,<1" "hypothesis>=6,<7" "pytest-cov>=7,<8"
      - run: uv pip install -e .
      - run: uv run --no-sync pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.3" "build>=1.3,<2" "twine>=6,<7"
      - run: uv build
      - run: twine check dist/*
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python -c "import authmate; assert authmate.__version__ == '0.1.0'"
