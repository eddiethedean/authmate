[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "authmate"
version = "0.1.0"
description = "FastAPI-native identity and authorization contracts"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.140,<1",
  "pydantic>=2.12,<3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "httpx>=0.28,<1",
  "hypothesis>=6,<7",
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/authmate"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["authmate"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/authmate", "tests"]
exclude = ["^tests/static/invalid_provider\\.py$"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "B008"]
"examples/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["docs/plans/**"]
